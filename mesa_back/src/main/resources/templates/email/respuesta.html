<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #fff;
            max-width: 560px;
            margin: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
            overflow: hidden;
        }

        .header {
            background: {
                    {
                    COLOR
                }
            }

            ;
            color: #fff;
            padding: 24px 32px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
        }

        .body {
            padding: 28px 32px;
            color: #333;
            line-height: 1.6;
        }

        .exp {
            background: #f0f3f5;

            border-left: 4px solid {
                    {
                    COLOR
                }
            }

            ;
            padding: 12px 16px;
            border-radius: 4px;
            margin: 16px 0;
            font-size: 16px;
            font-weight: bold;
        }

        .footer {
            background: #f0f3f5;
            text-align: center;
            padding: 14px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>{{ICONO}} {{TITULO}}</h1>
        </div>
        <div class="body">
            <p>Estimado(a) ciudadano(a),</p>
            <p>{{MENSAJE}}</p>
            {{MOTIVO_BLOQUE}}
            <div class="exp">N° Expediente: {{NUM_EXPEDIENTE}}</div>
            <p>
                Para mayor información puede
                <a href="{{URL_CONSULTA}}">consultar su expediente en línea</a>.
            </p>
        </div>
        {{PLAZO_BLOQUE}}
        <div class="footer">Mesa de Partes Virtual &copy; EPS emapat</div>
    </div>
</body>

</html>
